[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-v2"
version = "0.0.0"
description = "COCO-intra codec control and retarget geometry contracts"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"prism_v2.codec" = ["native/*.c", "native/CMakeLists.txt", "criteria/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = ["codec: requires locally pinned native codec and independent decoders"]
